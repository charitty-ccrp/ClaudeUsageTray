name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet test --configuration Release

      - name: Publish single-file exe and build the installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/ClaudeUsageTray -p:PublishProfile=win-x64 "-p:Version=$version"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer\ClaudeUsageTray.iss
          Copy-Item artifacts\publish\ClaudeUsageTray.exe "artifacts\ClaudeUsageTray-$version-portable.exe"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ClaudeUsageTraySetup-*.exe
            artifacts/ClaudeUsageTray-*-portable.exe

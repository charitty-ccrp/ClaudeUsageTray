name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste a token, cookie or the contents of `.credentials.json` here.**
        Security problems go to [a private report](https://github.com/charitty-ccrp/ClaudeUsageTray/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: download
    attributes:
      label: Which download?
      options:
        - Installer (Setup.exe)
        - Portable .exe
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - Claude Code login
        - claude.ai cookie
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Right-click the tray icon → **Copy diagnostics**, then paste here. Credentials are already removed from it.
      render: text
